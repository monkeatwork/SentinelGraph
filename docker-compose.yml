services:
  neo4j:
    image: neo4j:5-community
    container_name: sentinelgraph-neo4j
    mem_limit: 2g
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-sentinelgraph}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: sentinelgraph-mongodb
    mem_limit: 1.5g
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.75"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # The API is primarily run on the host during development (`npm start`).
  # Start it in Docker with:  docker compose --profile api up -d
  api:
    profiles: ["api"]
    build: .
    container_name: sentinelgraph-api
    mem_limit: 512m
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/sentinelgraph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-sentinelgraph}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: "3000"
    depends_on:
      neo4j:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  mongo_data: